name: Publicar LittleTec Studio
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    name: Web e Desktop Windows
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm ci
      - name: Preparar Python Windows
        run: |
          python -m venv .venv-windows
          .venv-windows/Scripts/python.exe -m pip install -r requirements/windows-desktop.txt
      - run: npm run web:pack
      - run: npm run desktop:pack
      - name: Conferir executável único sem USB
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tools/smoke-windows.ps1 -CloseWindow
      - uses: actions/upload-artifact@v4
        with:
          name: LittleTec-Studio
          path: |
            release/LittleTec-Studio.exe
            release/LittleTec-Studio-*.zip
            release/SHA256SUMS-*.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/LittleTec-Studio.exe
            release/LittleTec-Studio-*.zip
            release/SHA256SUMS-*.txt
          generate_release_notes: true
