name: Release Web Portátil

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Gerar Pacote HTML Portátil
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Compilar exportação estática
        run: npm run build:static

      - name: Compactar pacote estático
        run: |
          cd out
          zip -r ../LittleTec-Web-Standalone.zip ./*
          cd ..
          sha256sum LittleTec-Web-Standalone.zip > SHA256SUMS.txt

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            LittleTec-Web-Standalone.zip
            SHA256SUMS.txt
          generate_release_notes: true
