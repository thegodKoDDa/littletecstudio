appId: br.com.littletec.studio
productName: LittleTec Studio
directories:
  output: release
artifactName: LittleTec-Studio-${version}-win-x64.${ext}
files:
  - dist-electron/**
  - desktop/icon.png
  - out/**
  - package.json
  - LICENSE
  - '!node_modules/**/*'
extraMetadata:
  version: 0.3.0
extraResources:
  - from: build/bridge/LittleTec-Bridge
    to: bridge
win:
  target:
    - target: dir
      arch: [x64]
  executableName: LittleTec-Studio
  signAndEditExecutable: false
asar: true
