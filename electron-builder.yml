appId: br.com.littletec.studio
productName: LittleTec Studio
directories:
  output: release
artifactName: LittleTec-Studio-${version}-win-x64.${ext}
files:
  - dist-electron/**
  - desktop/icon.png
  - from: build/desktop-ui
    to: ui
    filter: ['**/*']
  - package.json
  - LICENSE
  - '!node_modules/**/*'
extraResources:
  - from: build/bridge/LittleTec-Bridge
    to: bridge
win:
  icon: desktop/icon.ico
  target:
    - target: dir
      arch: [x64]
  executableName: LittleTec-Studio
  signAndEditExecutable: false
asar: true
afterPack: tools/after-pack.cjs
